<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentTa · Rent, Book, Enjoy</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong
      // palette on load - ThemeContext (src/context/ThemeContext.jsx) takes
      // over from here for in-app toggling, using the same storage key.
      (function () {
        var saved = localStorage.getItem('rb_theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
