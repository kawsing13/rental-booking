<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rental Booking App banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f86d6"/>
      <stop offset="100%" stop-color="#3fb751"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- decorative icon cluster: table, chair, karaoke speaker -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- table -->
    <g transform="translate(870,120)">
      <rect x="0" y="0" width="220" height="26" rx="8"/>
      <line x1="18" y1="26" x2="18" y2="150"/>
      <line x1="202" y1="26" x2="202" y2="150"/>
    </g>
    <!-- chair -->
    <g transform="translate(760,190)">
      <path d="M0 0 L0 90 M0 0 L70 0 L70 90 M0 45 L70 45"/>
      <line x1="6" y1="90" x2="6" y2="130"/>
      <line x1="64" y1="90" x2="64" y2="130"/>
    </g>
    <!-- karaoke speaker -->
    <g transform="translate(1010,180)">
      <rect x="0" y="0" width="90" height="130" rx="14"/>
      <circle cx="45" cy="45" r="26"/>
      <circle cx="45" cy="100" r="14"/>
    </g>
  </g>

  <!-- brand mark -->
  <g transform="translate(72,86)">
    <circle cx="34" cy="34" r="34" fill="#ffffff" fill-opacity="0.95"/>
    <g transform="translate(16,16)" stroke="#2f86d6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="2" width="36" height="8" rx="3"/>
      <line x1="4" y1="10" x2="4" y2="30"/>
      <line x1="32" y1="10" x2="32" y2="30"/>
    </g>
  </g>

  <text x="72" y="220" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Rental Booking App
  </text>
  <text x="74" y="262" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#eaf4fc">
    Tables · Chairs · Karaoke Sets — browse, check availability, book online
  </text>

  <g transform="translate(74,292)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    <rect x="-16" y="-22" width="152" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/>
    <text x="-4" y="0">Node · Express</text>
    <rect x="150" y="-22" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/>
    <text x="162" y="0">React · Vite</text>
    <rect x="284" y="-22" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/>
    <text x="296" y="0">Flutter</text>
    <rect x="410" y="-22" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/>
    <text x="422" y="0">PostgreSQL</text>
  </g>
</svg>
