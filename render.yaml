# Render "Blueprint" - importing this repo on Render (New + > Blueprint)
# provisions the API web service. The database is Neon (not Render's own
# Postgres addon) - create a Neon project yourself first and paste its
# connection string into DATABASE_URL below (marked `sync: false`, so
# Render prompts for it during setup rather than trying to provision one).
# See README.md's Deployment section for the exact click-through steps.
services:
  - type: web
    name: rental-booking-backend
    runtime: node
    plan: free
    rootDir: backend
    # Seeders are idempotent (see src/db/seeders) so running seed on every
    # deploy is safe - no manual shell step needed to load the demo data.
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your Neon connection string here (Neon dashboard > Connection
      # Details > Connection string). Keep `?sslmode=require` if Neon
      # includes it - our pg config also forces SSL either way.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set this once the frontend is live on Vercel (its https://... URL) -
      # CORS blocks the browser from calling the API until this matches.
      - key: CLIENT_ORIGIN
        sync: false
      # Wallet payments (GCash/Maya) stay mocked until real gateway
      # credentials are added - see backend/src/services/paymentService.js.
      - key: PAYMENTS_MOCK_MODE
        value: 'true'
