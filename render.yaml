# Render "Blueprint" - importing this repo on Render (New + > Blueprint)
# auto-provisions the Postgres database and the API web service together,
# wires DATABASE_URL between them, and generates the JWT secrets. See
# README.md's Deployment section for the exact click-through steps and what
# still needs to be set by hand (CLIENT_ORIGIN, once the frontend has a URL).
databases:
  - name: rental-booking-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: rental-booking-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rental-booking-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set this once the frontend is live on Vercel (its https://... URL) -
      # CORS blocks the browser from calling the API until this matches.
      - key: CLIENT_ORIGIN
        sync: false
      # Wallet payments (GCash/Maya) stay mocked until real gateway
      # credentials are added - see backend/src/services/paymentService.js.
      - key: PAYMENTS_MOCK_MODE
        value: 'true'
